traefik:
  service:
    annotations:
      lbipam.cilium.io/ips: "192.168.50.220"   # pinned from the pool in k8s-apps/cilium

  ports:
    web:
      port: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 443

  api:
    dashboard: true
    insecure: false

  ingressClass:
    enabled: true
    isDefaultClass: true

  providers:
    kubernetesIngress:
      enabled: true
    kubernetesGateway:
      enabled: false