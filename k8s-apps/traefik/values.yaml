traefik:
  ports:
    web:
      port: 80
      nodePort: 30000
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 443
      nodePort: 30001

  api:
    dashboard: true
    insecure: false

  ingressClass:
    enabled: true
    isDefaultClass: true

  providers:
    kubernetesIngress:
      enabled: true
    kubernetesGateway:
      enabled: false