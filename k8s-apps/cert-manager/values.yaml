cert-manager:
  crds:
    enabled: true

  # Enable prometheus metrics
  #prometheus:
  #  enabled: true
  #  servicemonitor:
  #    enabled: true

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Webhook configuration
  webhook:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

  # CA injector
  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  # The DNS-01 self-check must see the TXT record in public DNS. The local resolver
  # doesn't forward cobaltcavern.com names, so it never sees _acme-challenge.
  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53