---
- name: Rebuild and restart Remote Control
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item }}"
    daemon_reload: true
    state: restarted
  loop:
    - claude-base-build.service
    - claude-remote-control-podman.service
  when: sandbox_claude_code_remote_control

- name: Restart Remote Control
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: claude-remote-control-podman.service
    daemon_reload: true
    state: restarted
  when: sandbox_claude_code_remote_control

- name: Restart podman.service
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: podman.service
    daemon_reload: true
    state: restarted
  when: sandbox_claude_code_remote_control
