---
# apt channel: stable (about a week behind, skips bad releases) or latest
sandbox_claude_code_channel: stable
sandbox_claude_code_key_fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE

# Needed by Claude Code itself: the sandbox (bubblewrap, socat) and the key check (gnupg)
sandbox_claude_code_packages:
  - bubblewrap
  - socat
  - gnupg

# Extra tools for the sandbox user
sandbox_packages: []
sandbox_allowlist: []
# GitHub access for the sandbox user; the GitHub tasks are skipped when the token is empty
sandbox_github_token: ""
sandbox_git_user_name: Claude
sandbox_git_user_email: noreply@anthropic.com

# Workspace where sessions start, in the sandbox user's home; repos and worktrees live under it
sandbox_claude_code_workspace_name: workspace
sandbox_claude_code_workspace: "/home/{{ sandbox_user }}/{{ sandbox_claude_code_workspace_name }}"

# Run `claude remote-control` as a systemd service
sandbox_claude_code_remote_control: false
sandbox_claude_code_remote_control_name: "{{ inventory_hostname }}"
sandbox_claude_code_remote_control_mode: auto
