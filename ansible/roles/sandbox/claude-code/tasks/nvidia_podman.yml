---
- name: Install prerequisites for NVIDIA Container Toolkit repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg2
    state: present
    update_cache: true

- name: Ensure /usr/share/keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if NVIDIA Container Toolkit keyring already exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  register: nvidia_keyring_stat

- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.asc
    mode: "0644"
  when: not nvidia_keyring_stat.stat.exists

- name: Verify NVIDIA Container Toolkit GPG key fingerprint
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /tmp/nvidia-container-toolkit.asc
  register: nvidia_toolkit_key
  changed_when: false
  when: not nvidia_keyring_stat.stat.exists

- name: Dearmor NVIDIA Container Toolkit GPG key to keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg /tmp/nvidia-container-toolkit.asc
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  when: not nvidia_keyring_stat.stat.exists

- name: Remove temporary NVIDIA GPG key file
  ansible.builtin.file:
    path: /tmp/nvidia-container-toolkit.asc
    state: absent
  when: not nvidia_keyring_stat.stat.exists

- name: Fetch NVIDIA Container Toolkit repository list
  ansible.builtin.uri:
    url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
    return_content: true
  register: nvidia_repo_list

- name: Write signed NVIDIA Container Toolkit repository list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{ nvidia_repo_list.content | regex_replace('deb https://', 'deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://') }}


- name: Install NVIDIA Container Toolkit packages ({{ nvidia_container_toolkit_version | default('1.20.2-1') }})
  ansible.builtin.apt:
    name:
      - "nvidia-container-toolkit={{ nvidia_container_toolkit_version | default('1.20.2-1') }}"
      - "nvidia-container-toolkit-base={{ nvidia_container_toolkit_version | default('1.20.2-1') }}"
      - "libnvidia-container-tools={{ nvidia_container_toolkit_version | default('1.20.2-1') }}"
      - "libnvidia-container1={{ nvidia_container_toolkit_version | default('1.20.2-1') }}"
    state: present
    update_cache: true

- name: Generate NVIDIA CDI specification for rootless Podman
  ansible.builtin.command:
    cmd: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    creates: /etc/cdi/nvidia.yaml
