---
- name: Install Claude Code dependencies and sandbox tools
  ansible.builtin.apt:
    name: "{{ sandbox_claude_code_packages + sandbox_packages }}"
    state: present

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Claude Code signing key
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/keys/claude-code.asc
    dest: /etc/apt/keyrings/claude-code.asc
    owner: root
    group: root
    mode: "0644"

- name: Verify Claude Code signing key fingerprint
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /etc/apt/keyrings/claude-code.asc
  register: sandbox_claude_code_key
  changed_when: false
  failed_when: sandbox_claude_code_key_fingerprint not in sandbox_claude_code_key.stdout

- name: Add Claude Code apt repo ({{ sandbox_claude_code_channel }})
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/claude-code.asc]
      https://downloads.claude.ai/claude-code/apt/{{ sandbox_claude_code_channel }}
      {{ sandbox_claude_code_channel }} main
    filename: claude-code
    state: present

- name: Install Claude Code
  ansible.builtin.apt:
    name: claude-code
    state: present

- name: Create /etc/claude-code
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install managed CLAUDE.md
  ansible.builtin.template:
    src: managed-CLAUDE.md.j2
    dest: "/etc/claude-code/CLAUDE.md"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install managed settings
  ansible.builtin.template:
    src: managed-settings.json.j2
    dest: /etc/claude-code/managed-settings.json
    owner: root
    group: root
    mode: "0644"
    validate: python3 -m json.tool %s

- name: Remove Debian's nodejs and npm (mise provides Node)
  ansible.builtin.apt:
    name:
      - npm
      - nodejs
    state: absent

- name: Install extrepo
  ansible.builtin.apt:
    name: extrepo
    state: present

- name: Enable the mise apt repository
  ansible.builtin.command:
    cmd: extrepo enable mise
    creates: /etc/apt/sources.list.d/extrepo_mise.sources

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true

# Sandbox allowWrite paths must exist; parents listed first so they're owned by the user
- name: Create tool and cache directories for {{ sandbox_user }}
  ansible.builtin.file:
    path: "/home/{{ sandbox_user }}/{{ item }}"
    state: directory
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0755"
  loop:
    - .cache
    - .npm
    - .config
    - .config/mise
    - .local
    - .local/share
    - .local/share/mise
    - .local/state
    - .local/state/mise

- name: Create workspace directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0755"
  loop:
    - "{{ sandbox_claude_code_workspace }}"
    - "{{ sandbox_claude_code_workspace }}/repos"
    - "{{ sandbox_claude_code_workspace }}/worktrees"

- name: Install workspace CLAUDE.md
  ansible.builtin.template:
    src: workspace-CLAUDE.md.j2
    dest: "{{ sandbox_claude_code_workspace }}/CLAUDE.md"
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0644"

- name: Install Remote Control service
  ansible.builtin.template:
    src: claude-remote-control.service.j2
    dest: /etc/systemd/system/claude-remote-control.service
    owner: root
    group: root
    mode: "0644"
  when: sandbox_claude_code_remote_control
  notify: Restart Remote Control

- name: Enable and start Remote Control
  ansible.builtin.systemd_service:
    name: claude-remote-control
    enabled: true
    state: started
    daemon_reload: true
  when: sandbox_claude_code_remote_control
