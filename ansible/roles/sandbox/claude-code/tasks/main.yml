---
- name: Podman NVIDIA passthrough
  ansible.builtin.import_tasks: nvidia_podman.yml

- name: Delegate cpu, cpuset, io, memory, and pids controllers to user slices
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write cgroup delegation config
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Delegate=cpu cpuset io memory pids
  register: sandbox_delegation_conf

- name: Enable systemd lingering for {{ sandbox_user }}
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ sandbox_user }}"
    creates: "/var/lib/systemd/linger/{{ sandbox_user }}"

- name: Ensure user systemd manager is started and picks up cgroup delegation
  ansible.builtin.systemd_service:
    name: "user@{{ sandbox_user_info.uid }}.service"
    daemon_reload: true
    state: "{{ 'restarted' if sandbox_delegation_conf.changed else 'started' }}"

- name: Install host Podman, GPU container tools, and systemd-oomd
  ansible.builtin.apt:
    name:
      - podman
      - passt
      - fuse-overlayfs
      - uidmap
      - systemd-oomd
    state: present
    update_cache: true

- name: Enable and start systemd-oomd and nvidia-persistenced
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - systemd-oomd
    - nvidia-persistenced

- name: Create Claude config, cache, and Quadlet directories for {{ sandbox_user }}
  ansible.builtin.file:
    path: "/home/{{ sandbox_user }}/{{ item }}"
    state: directory
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0755"
  loop:
    - .claude
    - .cache
    - .config
    - .config/containers
    - .config/containers/systemd
    - .config/systemd/user/podman.service.d

- name: Create workspace directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0755"
  loop:
    - "{{ sandbox_claude_code_workspace }}"
    - "{{ sandbox_claude_code_workspace }}/repos"
    - "{{ sandbox_claude_code_workspace }}/worktrees"

- name: Install workspace CLAUDE.md
  ansible.builtin.template:
    src: workspace-CLAUDE.md.j2
    dest: "{{ sandbox_claude_code_workspace }}/CLAUDE.md"
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0644"

- name: Podman create sandbox
  ansible.builtin.import_tasks: build_container.yml

- name: Store GitHub token as a rootless Podman secret
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  containers.podman.podman_secret:
    name: github_token
    data: "{{ sandbox_github_token }}"
    state: present
  no_log: true
  when: sandbox_github_token | length > 0
  notify: Restart Remote Control

- name: Enable and start rootless podman.socket for {{ sandbox_user }}
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: podman.socket
    enabled: true
    state: started

- name: Give the rootless podman.service the egress proxy (image pulls run there)
  ansible.builtin.copy:
    dest: "/home/{{ sandbox_user }}/.config/systemd/user/podman.service.d/proxy.conf"
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0644"
    content: |
      [Service]
      Environment=HTTP_PROXY=http://127.0.0.1:{{ sandbox_proxy_port }}
      Environment=HTTPS_PROXY=http://127.0.0.1:{{ sandbox_proxy_port }}
      Environment=NO_PROXY=localhost,127.0.0.1,::1
  register: sandbox_podman_service_proxy
  notify: Restart podman.service

- name: Install Remote Control Quadlet container unit
  ansible.builtin.template:
    src: claude-remote-control.container.j2
    dest: "/home/{{ sandbox_user }}/.config/containers/systemd/claude-remote-control.container"
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0644"
  when: sandbox_claude_code_remote_control
  notify: Restart Remote Control

- name: Enable and start Remote Control Quadlet service
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    name: claude-remote-control
    daemon_reload: true
    state: started
  when: sandbox_claude_code_remote_control
