---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Create /etc/nftables.d
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look up the UID of {{ sandbox_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ sandbox_user }}"

- name: Read the sub-UID range of {{ sandbox_user }}
  ansible.builtin.command:
    cmd: "grep -m1 '^{{ sandbox_user }}:' /etc/subuid"
  register: sandbox_subuid
  changed_when: false

- name: Set UID facts for the egress rules
  ansible.builtin.set_fact:
    sandbox_uid: "{{ getent_passwd[sandbox_user][1] }}"
    sandbox_subuid_start: "{{ sandbox_subuid.stdout.split(':')[1] | int }}"
    sandbox_subuid_end: "{{ sandbox_subuid.stdout.split(':')[1] | int + sandbox_subuid.stdout.split(':')[2] | int - 1 }}"

- name: Install sandbox egress rules
  ansible.builtin.template:
    src: sandbox-egress.nft.j2
    dest: /etc/nftables.d/sandbox-egress.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Include /etc/nftables.d from the main nftables config
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/*.nft"'
    insertafter: EOF
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Set proxy environment for {{ sandbox_user }}
  ansible.builtin.template:
    src: sandbox-proxy.sh.j2
    dest: /etc/profile.d/sandbox-proxy.sh
    owner: root
    group: root
    mode: "0644"
