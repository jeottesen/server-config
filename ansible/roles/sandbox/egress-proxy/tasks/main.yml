---
# --- Squid ---
- name: Install squid
  ansible.builtin.apt:
    name: squid
    state: present

- name: Configure squid
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart squid

- name: Enable and start squid
  ansible.builtin.systemd_service:
    name: squid
    enabled: true
    state: started

- name: Apply squid config
  ansible.builtin.meta: flush_handlers

# --- AdGuard Home ---
- name: Download and unpack AdGuard Home {{ sandbox_adguard_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ sandbox_adguard_version }}/AdGuardHome_linux_{{ sandbox_adguard_arch }}.tar.gz"
    dest: /opt
    remote_src: true
    mode: "0700"
    creates: /opt/AdGuardHome/AdGuardHome

# Before the service is installed, so the first start skips the setup wizard.
- name: Configure AdGuard Home
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart AdGuard Home

- name: Install AdGuard Home service
  ansible.builtin.command:
    cmd: /opt/AdGuardHome/AdGuardHome -s install
    chdir: /opt/AdGuardHome
    creates: /etc/systemd/system/AdGuardHome.service

- name: Enable and start AdGuard Home
  ansible.builtin.systemd_service:
    name: AdGuardHome
    enabled: true
    state: started
