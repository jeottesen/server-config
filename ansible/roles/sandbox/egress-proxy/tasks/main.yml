---
# --- Squid ---
- name: Install squid
  ansible.builtin.apt:
    name: squid
    state: present

- name: Configure squid
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart squid

- name: Enable and start squid
  ansible.builtin.systemd_service:
    name: squid
    enabled: true
    state: started

- name: Apply squid config
  ansible.builtin.meta: flush_handlers

# --- AdGuard Home ---
- name: Download and unpack AdGuard Home {{ sandbox_adguard_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ sandbox_adguard_version }}/AdGuardHome_linux_{{ sandbox_adguard_arch }}.tar.gz"
    dest: /opt
    remote_src: true
    mode: "0700"
    creates: /opt/AdGuardHome/AdGuardHome

- name: Install AdGuard Home service
  ansible.builtin.command:
    cmd: /opt/AdGuardHome/AdGuardHome -s install
    chdir: /opt/AdGuardHome
    creates: /etc/systemd/system/AdGuardHome.service

- name: Enable and start AdGuard Home
  ansible.builtin.systemd_service:
    name: AdGuardHome
    enabled: true
    state: started

- name: Check whether AdGuard Home is configured
  ansible.builtin.stat:
    path: /opt/AdGuardHome/AdGuardHome.yaml
  register: sandbox_adguard_config

# Runs once. After this the UI owns the settings.
- name: AdGuard Home first-run setup
  when: not sandbox_adguard_config.stat.exists
  block:
    - name: Wait for the setup wizard
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 30

    - name: Set listen addresses and admin login
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/control/install/configure
        method: POST
        body_format: json
        body:
          web:
            ip: "{{ sandbox_adguard_ui_ip }}"
            port: "{{ sandbox_adguard_ui_port | int }}"
          dns:
            ip: 127.0.0.1
            port: 53
          username: "{{ sandbox_adguard_user }}"
          password: "{{ sandbox_adguard_password }}"
      no_log: true

    - name: Set upstream DNS and blocking mode
      ansible.builtin.uri:
        url: "http://{{ sandbox_adguard_ui_ip }}:{{ sandbox_adguard_ui_port }}/control/dns_config"
        method: POST
        url_username: "{{ sandbox_adguard_user }}"
        url_password: "{{ sandbox_adguard_password }}"
        force_basic_auth: true
        body_format: json
        body:
          upstream_dns: "{{ sandbox_adguard_upstream_dns }}"
          blocking_mode: null_ip
      register: sandbox_adguard_result
      until: sandbox_adguard_result.status == 200
      retries: 10
      delay: 2

    - name: Seed allowlist rules
      ansible.builtin.uri:
        url: "http://{{ sandbox_adguard_ui_ip }}:{{ sandbox_adguard_ui_port }}/control/filtering/set_rules"
        method: POST
        url_username: "{{ sandbox_adguard_user }}"
        url_password: "{{ sandbox_adguard_password }}"
        force_basic_auth: true
        body_format: json
        body:
          rules: "{{ ['! Block everything', '/.*/'] + ((sandbox_claude_code_hosts + sandbox_allowlist) | map('regex_replace', '^(.+)$', '@@||\\1^') | list) }}"
