---
# Claude sandbox user (moved here from the play vars in setup-sandbox.yml)
sandbox_user: claude
sandbox_claude_code_remote_control: true

# Egress proxy the sandbox user is forced through.
# Local for now; when it moves to k3s, point the host at Squid's LAN/NetBird IP.
sandbox_proxy_host: 127.0.0.1
sandbox_proxy_port: 3128

# AdGuard Home (local, temporary until the cluster version)
sandbox_adguard_version: v0.107.79

sandbox_adguard_upstream_dns:
  - tls://dns.quad9.net

sandbox_adguard_user: "{{ primary_user }}"
sandbox_adguard_password: "{{ vault_adguard_password }}"
sandbox_adguard_password_hash: "{{ vault_sandbox_adguard_password_hash }}"

# GitHub access for Claude on devbox (fine-grained PAT, test-bed repo only)
sandbox_github_token: "{{ vault_sandbox_github_token }}"

# A domain here also allows its subdomains.
# Hosts Claude Code itself connects to. AdGuard only; sandboxed commands don't need them.
sandbox_claude_code_hosts:
  - api.anthropic.com
  - mcp-proxy.anthropic.com
  - claude.ai
  - claude.com
  - frame.claudeusercontent.com

# Baseline tools for the sandbox
sandbox_packages:
  - git
  - gh
  - unzip
  - jq
  - build-essential
