---

all:
  children:
    hypervisors:
      hosts:
        #nas:
        pve-mini-01: # i3 9th Gen Optiplex 3070 SFF 16GB RAM
        pve-mini-02: # i3 9th Gen Optiplex 3070 SFF 12GB RAM
        pve-dev: # i5-8600K GTX 1070 Ti 16GB RAM Desktop
        #crypt:  # Backup NAS

    k3s_cluster:
      children:
        server:
          hosts:
            k3s-server-01: 
        agent:
          hosts:
            k3s-server-02:
      vars:
        k3s_version: v1.31.12+k3s1
        token: "{{ k3s_token }}"
        api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
        cluster_context: samurai-cluster
        server_config_yaml:  |
          disable:
            - traefik

    sandboxes:
      hosts:
        devbox: # Claude sandbox VM on pve-dev
    
    services:
      hosts:
        mediaserver: # Legacy media vm on nas
        media:  # Plex LXC
        rakugo: # docker stack on pve-mini-01
        homeassistant: # 
        dev: # vscode and other dev tools

    external:
      hosts:
        stormfront:
          ansible_host: storm.cobaltcavern.com
          vars:

  vars:
    ansible_user: "{{ primary_user }}"
    ansible_become_pass: '{{ vault_become_pass }}'
    ansible_host: '{{ inventory_hostname }}.{{ local_domain }}'
    
