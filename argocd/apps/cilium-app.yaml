apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  project: default
  source:
    repoURL: 'https://github.com/jeottesen/server-config.git'
    targetRevision: HEAD
    path: "k8s-apps/cilium"
  destination:
    name: in-cluster
    namespace: kube-system
  # Helm regenerates these certificates on every render, so Argo would show them
  # OutOfSync forever. https://docs.cilium.io/en/latest/configuration/argocd-issues/
  ignoreDifferences:
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # Talos: without this, Argo fails on appArmorProfile ("field not declared in schema")
      - ServerSideApply=true